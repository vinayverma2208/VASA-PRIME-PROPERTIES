<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Signup | VASA PRIME PROPERTIES</title>

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0057D9, #2D9CDB);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-container {
      width: 360px;
      height: 520px;
      perspective: 1000px;
    }

    .flip-card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.9s;
      transform-style: preserve-3d;
    }

    .flip-card.flipped {
      transform: rotateY(180deg);
    }

    .side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .side h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #0057D9;
    }

    .side form input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .side button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #0057D9;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .side button:hover {
      background: #0044b5;
    }

    .toggle-link {
      text-align: center;
      margin-top: 15px;
      color: #0057D9;
      font-weight: 500;
      cursor: pointer;
    }

    /* Signup Back Side */
    #signupSide {
      transform: rotateY(180deg);
    }

    /* Logout Section */
    .logout-box {
      display: none;
      width: 360px;
      background: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .logout-box h2 {
      color: #0057D9;
    }

    .logout-box button {
      width: 80%;
      padding: 12px;
      background: #e73156;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      font-size: 16px;
    }

    .logout-box button:hover {
      background: #c02747;
    }

  </style>
</head>
<body>

  <div class="auth-container" id="authBox">
    <div class="flip-card" id="flipCard">
      
      <!-- LOGIN FORM -->
      <div class="side" id="loginSide">
        <h2>Login</h2>

        <form id="loginForm">
          <input type="email" id="loginEmail" placeholder="Email" required>
          <input type="password" id="loginPass" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>

        <div class="toggle-link" onclick="flipToSignup()">
          Don't have an account? Sign Up
        </div>
      </div>

      <!-- SIGNUP FORM -->
      <div class="side" id="signupSide">
        <h2>Create Account</h2>

        <form id="signupForm">
          <input type="text" id="signupName" placeholder="Full Name" required>
          <input type="email" id="signupEmail" placeholder="Email" required>
          <input type="password" id="signupPass" placeholder="Password" required>
          <button type="submit">Sign Up</button>
        </form>

        <div class="toggle-link" onclick="flipToLogin()">
          Already have an account? Login
        </div>
      </div>

    </div>
  </div>

  <!-- LOGOUT SECTION -->
  <div class="logout-box" id="logoutBox">
    <h2>Welcome, <span id="usernameDisplay"></span></h2>
    <p>You are logged in.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    const flipCard = document.getElementById("flipCard");
    const logoutBox = document.getElementById("logoutBox");
    const authBox = document.getElementById("authBox");

    function flipToSignup() {
      flipCard.classList.add("flipped");
    }

    function flipToLogin() {
      flipCard.classList.remove("flipped");
    }

    // SIGNUP LOGIC
    document.getElementById("signupForm").addEventListener("submit", function(e) {
      e.preventDefault();

      let name = signupName.value;
      let email = signupEmail.value;
      let pass = signupPass.value;

      localStorage.setItem("userName", name);
      localStorage.setItem("userEmail", email);
      localStorage.setItem("userPass", pass);

      alert("Signup Successful! Please Login.");
      flipToLogin();
    });

    // LOGIN LOGIC
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      let email = loginEmail.value;
      let pass = loginPass.value;

      if (
        email === localStorage.getItem("userEmail") &&
        pass === localStorage.getItem("userPass")
      ) {
        localStorage.setItem("isLoggedIn", "true");

        authBox.style.display = "none";
        logoutBox.style.display = "block";

        usernameDisplay.innerText = localStorage.getItem("userName");

        // Redirect after 1 second
        setTimeout(() => {
          window.location.href = "property.html";
        }, 1000);

      } else {
        alert("Invalid Email or Password!");
      }
    });

    // LOGOUT
    function logout() {
      localStorage.removeItem("isLoggedIn");
      window.location.reload();
    }

    // AUTO SHOW LOGOUT BOX IF ALREADY LOGGED IN
    if (localStorage.getItem("isLoggedIn") === "true") {
      authBox.style.display = "none";
      logoutBox.style.display = "block";
      usernameDisplay.innerText = localStorage.getItem("userName");
    }
  </script>

</body>
</html>
